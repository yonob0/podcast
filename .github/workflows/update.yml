name: Mise à jour des podcasts

on:
  schedule:
    - cron: "0 5 * * *"   # tous les jours à 5 h UTC
  workflow_dispatch:       # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Télécharger les flux
        run: python scripts/update_feeds.py
      - name: Enregistrer les changements
        run: |
          git config user.name "podcast-bot"
          git config user.email "podcast-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Mise à jour des épisodes" && git push)
